<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" fill="none" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="tranquil-browser — a web app loading in an editor tab">
  <!-- window frame -->
  <rect x="1" y="1" width="798" height="398" rx="4" fill="#1a1d24" stroke="#4c525c" stroke-width="1"/>
  <rect x="1.5" y="1.5" width="797" height="36" fill="#15181e"/>
  <circle cx="26" cy="19" r="6" fill="#e8735f"/>
  <circle cx="48" cy="19" r="6" fill="#e5a94d"/>
  <circle cx="70" cy="19" r="6" fill="#4ccb86"/>
  <text x="400" y="24" text-anchor="middle" font-size="14" fill="#7f838c" letter-spacing="0.5">tranquil-browser</text>

  <!-- tab strip -->
  <line x1="1" y1="37" x2="799" y2="37" stroke="#4c525c" stroke-opacity="0.6"/>
  <rect x="14" y="45" width="184" height="30" rx="6" fill="#22262e"/>
  <rect x="14" y="71" width="184" height="4" fill="#78A4FF"/>
  <text x="34" y="65" font-size="13" fill="#ece8df">Home</text>
  <circle cx="24" cy="60" r="3.5" fill="#78A4FF"/>
  <text x="220" y="65" font-size="13" fill="#7f838c">example.com</text>
  <text x="360" y="65" font-size="16" fill="#5b6068">+</text>

  <!-- toolbar -->
  <text x="24" y="102" font-size="17" fill="#7f838c">‹</text>
  <text x="48" y="102" font-size="17" fill="#5b6068">›</text>
  <text x="72" y="101" font-size="14" fill="#7f838c">⟳</text>
  <rect x="96" y="86" width="690" height="24" rx="12" fill="#12141a" stroke="#4c525c"/>
  <text x="112" y="102" font-size="12.5" fill="#b4afa6"><tspan fill="#78A4FF">⌂</tspan><tspan dx="5">tranquil-browser://home</tspan></text>
  <rect x="300" y="92" width="1.5" height="12" fill="#78A4FF"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.05s" repeatCount="indefinite"/></rect>

  <!-- page-load progress sweep (navigation loop) -->
  <rect x="1" y="115" height="2.5" fill="#78A4FF">
    <animate attributeName="width" values="0;0;797;797;797" keyTimes="0;0.12;0.42;0.5;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.12;0.4;0.52;1" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- rendered page (dims, then repaints on each nav cycle) -->
  <g>
    <animate attributeName="opacity" values="1;0.1;0.1;1;1" keyTimes="0;0.12;0.36;0.62;1" dur="4s" repeatCount="indefinite"/>
    <rect x="28" y="134" width="236" height="150" rx="8" fill="#78A4FF" fill-opacity="0.16"/>
    <path d="M132 196 l24 13 -24 13 z" fill="#78A4FF" fill-opacity="0.55"/>
    <rect x="288" y="140" width="300" height="16" rx="4" fill="#3a4049"/>
    <rect x="288" y="172" width="428" height="10" rx="3" fill="#2b2f38"/>
    <rect x="288" y="192" width="384" height="10" rx="3" fill="#2b2f38"/>
    <rect x="288" y="212" width="404" height="10" rx="3" fill="#2b2f38"/>
    <rect x="288" y="232" width="250" height="10" rx="3" fill="#2b2f38"/>
    <rect x="288" y="256" width="96" height="24" rx="12" fill="#78A4FF" fill-opacity="0.22" stroke="#78A4FF" stroke-opacity="0.45"/>
    <rect x="28" y="306" width="236" height="66" rx="8" fill="#22262e" stroke="#3a4049"/>
    <rect x="282" y="306" width="236" height="66" rx="8" fill="#22262e" stroke="#3a4049"/>
    <rect x="536" y="306" width="236" height="66" rx="8" fill="#22262e" stroke="#3a4049"/>
  </g>

  <text x="778" y="390" text-anchor="end" font-size="12" fill="#5b6068" letter-spacing="0.5">tranquil</text>
</svg>

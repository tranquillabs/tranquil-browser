<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tranquil Browser</title>
    <script>
      // The host tags this URL with the app's active theme (?theme=dark|light),
      // which can differ from the OS color scheme. Apply it to <html> before the
      // stylesheet parses so there's no flash; absent the param, the CSS below
      // falls back to prefers-color-scheme.
      (function () {
        var m = /[?&]theme=(dark|light)/.exec(location.search);
        if (m) document.documentElement.setAttribute('data-theme', m[1]);
      })();
    </script>
    <script>
      // No history.pushState here: faking a cross-origin "tranquil-browser://blank"
      // URL breaks the Back button (Chromium can't reload that fake entry from
      // another page). The host maps this real home.html document to the friendly
      // "tranquil-browser://blank" in the address bar instead (see updatePageUrl).
      ( async () => {
        await new Promise(r => setTimeout(r, 100));
        window?.electron?.send('tab-focus');
      } )();
    </script>
    <style>
      /* Tranquil business palette, hardcoded (the page is an isolated file://
         webview and can't read theme LESS). Default = business-dark; the light
         palette applies when the host passes ?theme=light (data-theme on <html>),
         or — absent the param — when the OS reports a light color scheme. Values
         mirror tranquil-business-{dark,light}/styles/colors.less. */
      :root, :root[data-theme="dark"] {
        --bg:        #1F1E1B;
        --bg-input:  #34322D;
        --text:      #E6E1D8;
        --text-dim:  #7F776D;
        --heading:   #F1ECE3;
        --border:    #34322D;
        --accent:    #78A4FF;
        /* logo.svg references --color-accent; keep it in sync. */
        --color-accent: var(--accent);
        --shadow: 0 8px 30px rgba(0, 0, 0, 0.28);
        /* Popover surface — mirrors @popover-bg / @border-strong / @selected so
           the suggestions dropdown matches the URL bar's dropdown. */
        --popover-bg:     #292823;
        --popover-border: #46433B;
        --popover-active: #1E344C;
      }
      :root[data-theme="light"] {
        --bg:        #FFFFFF;
        --bg-input:  #EBEBEA;
        --text:      #37352F;
        --text-dim:  #B4B4B4;
        --heading:   #37352F;
        --border:    #E9E9E7;
        --accent:    #155DFF;
        --shadow: 0 8px 30px rgba(15, 15, 15, 0.08);
        --popover-bg:     #FFFFFF;
        --popover-border: #D9D9D6;
        --popover-active: #E8F4FE;
      }
      /* No explicit theme from the host → follow the OS color scheme. */
      @media (prefers-color-scheme: light) {
        :root:not([data-theme]) {
          --bg:        #FFFFFF;
          --bg-input:  #EBEBEA;
          --text:      #37352F;
          --text-dim:  #B4B4B4;
          --heading:   #37352F;
          --border:    #E9E9E7;
          --accent:    #155DFF;
          --shadow: 0 8px 30px rgba(15, 15, 15, 0.08);
          --popover-bg:     #FFFFFF;
          --popover-border: #D9D9D6;
          --popover-active: #E8F4FE;
        }
      }

      * { box-sizing: border-box; }

      html, body {
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Sit a touch above dead-center — reads calmer than true middle. */
        padding-bottom: 6vh;
      }

      .home {
        width: 100%;
        max-width: 560px;
        padding: 0 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        opacity: 0;
        transform: translateY(6px);
        animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      @keyframes rise {
        to { opacity: 1; transform: none; }
      }

      .mark {
        width: 56px;
        height: 56px;
        margin-bottom: 22px;
      }

      .wordmark {
        margin: 0;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.14em;
        color: var(--heading);
        text-indent: 0.14em; /* balance the trailing letter-spacing */
      }

      .clock {
        margin: 18px 0 2px;
        font-size: 52px;
        font-weight: 300;
        line-height: 1;
        letter-spacing: 0.01em;
        color: var(--text);
        font-variant-numeric: tabular-nums;
      }

      /* AM/PM, sized down beside the time. */
      .meridiem {
        margin-left: 10px;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: 0.04em;
        color: var(--text);
      }

      /* Time-zone abbreviation, sized down and dimmed beside the time. */
      .tz {
        margin-left: 8px;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.06em;
        color: var(--text-dim);
      }

      .greeting {
        margin: 0 0 30px;
        font-size: 15px;
        font-weight: 400;
        color: var(--text-dim);
      }

      .search {
        position: relative;
        width: 100%;
      }

      .search svg {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        width: 17px;
        height: 17px;
        stroke: var(--text-dim);
        pointer-events: none;
      }

      .search input {
        width: 100%;
        height: 50px;
        padding: 0 20px 0 46px;
        font: inherit;
        font-size: 15px;
        color: var(--text);
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 25px;
        outline: none;
        box-shadow: var(--shadow);
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .search input::placeholder { color: var(--text-dim); }

      .search-note {
        margin: 14px 0 0;
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 0.01em;
        color: var(--text-dim);
      }

      .search input:focus {
        border-color: var(--accent);
        box-shadow: var(--shadow), 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
      }

      /* color-mix fallback for older engines: a plain accent ring. */
      @supports not (color: color-mix(in srgb, red, blue)) {
        .search input:focus { box-shadow: var(--shadow), 0 0 0 3px var(--accent); }
      }

      /* Search-suggestion dropdown (mirrors the URL bar's suggestions). */
      .suggestions {
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        right: 0;
        margin: 0;
        padding: 6px;
        list-style: none;
        background: var(--popover-bg);
        border: 1px solid var(--popover-border);
        border-radius: 14px;
        box-shadow: var(--shadow);
        z-index: 10;
        text-align: left;
        display: none;
      }

      .suggestions.open { display: block; }

      .suggestions li {
        padding: 9px 16px;
        border-radius: 9px;
        font-size: 14px;
        line-height: 1.3;
        color: var(--text);
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .suggestions li.active {
        background: var(--popover-active);
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main class="home">
      <!-- Brand mark (from www-tranquil Logo.svelte), driven by --accent. -->
      <svg class="mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- ascender + descender rails -->
        <path d="M2 5 H30"  stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round"></path>
        <path d="M2 27 H30" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round"></path>
        <!-- node -->
        <rect x="10" y="11" width="12" height="10" rx="3" stroke="var(--accent)" stroke-width="3"></rect>
        <!-- ports: two in, one out -->
        <path d="M2 14 H10"  stroke="var(--accent)" stroke-width="3" stroke-linecap="round"></path>
        <path d="M2 18 H10"  stroke="var(--accent)" stroke-width="3" stroke-linecap="round"></path>
        <path d="M22 16 H30" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"></path>
      </svg>

      <h1 class="wordmark">TRANQUIL</h1>
      <div class="clock"><span id="time">&nbsp;</span><span class="meridiem" id="meridiem"></span><span class="tz" id="tz"></span></div>
      <p class="greeting" id="greeting">&nbsp;</p>

      <form class="search" id="search" autocomplete="off">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
        </svg>
        <input id="q" type="text" placeholder="Search the web or enter a URL"
               spellcheck="false" autocapitalize="off" autocorrect="off"
               autocomplete="off" role="combobox" aria-autocomplete="list"
               aria-expanded="false" aria-controls="suggestions" />
        <ul class="suggestions" id="suggestions" role="listbox"></ul>
      </form>
      <p class="search-note">Search provided by DuckDuckGo</p>
    </main>

    <script>
      (function () {
        // --- Clock + greeting -------------------------------------------------
        // Everything is local time (getHours/getMinutes + the OS time zone).
        var timeEl = document.getElementById('time');
        var meridiemEl = document.getElementById('meridiem');
        var tzEl = document.getElementById('tz');
        var greetEl = document.getElementById('greeting');

        // Short time-zone abbreviation for the local zone (e.g. "PDT", "GMT+1").
        function tzAbbrev(now) {
          try {
            var parts = new Intl.DateTimeFormat(undefined, {
              timeZoneName: 'short',
            }).formatToParts(now);
            for (var i = 0; i < parts.length; i++) {
              if (parts[i].type === 'timeZoneName') return parts[i].value;
            }
          } catch (e) {}
          return '';
        }

        function render() {
          var now = new Date();
          var h = now.getHours();
          var m = now.getMinutes();
          var hour12 = h % 12 || 12;
          timeEl.textContent = hour12 + ':' + (m < 10 ? '0' + m : m);
          meridiemEl.textContent = h < 12 ? 'AM' : 'PM';
          tzEl.textContent = tzAbbrev(now);
          greetEl.textContent =
            'Good ' + (h < 12 ? 'morning' : h < 18 ? 'afternoon' : 'evening');
        }
        render();
        setInterval(render, 15000); // catch the minute rollover promptly

        // --- Search / navigate ------------------------------------------------
        var HAS_SCHEME = /^[a-z][a-z0-9+.-]*:\/\//i;
        var DOMAIN_LIKE = /^[^\s]+\.[^\s]{2,}/;

        function targetFor(raw) {
          var v = raw.trim();
          if (!v) return null;
          if (HAS_SCHEME.test(v)) return v;
          if (DOMAIN_LIKE.test(v) && !/\s/.test(v)) return 'https://' + v;
          // DuckDuckGo — matches the engine used everywhere else in the browser
          // (URL-bar search, right-click search, homepage fallback).
          return 'https://duckduckgo.com/?q=' + encodeURIComponent(v);
        }

        var qEl = document.getElementById('q');

        function go(text) {
          var url = targetFor(text);
          if (url) window.location.href = url;
        }

        document.getElementById('search').addEventListener('submit', function (e) {
          e.preventDefault();
          go(qEl.value);
        });

        // --- Search suggestions ----------------------------------------------
        // Same suggestion source as the URL bar, fetched through the preload
        // (window.electron.suggest) because this file:// page can't reach the
        // endpoint cross-origin. Debounced; stale responses are dropped by seq.
        var sugEl = document.getElementById('suggestions');
        var items = [];        // current suggestion strings
        var activeIdx = -1;    // keyboard/hover-highlighted row
        var debounceTimer = null;
        var seq = 0;           // request sequence — ignore out-of-order replies

        function closeSuggestions() {
          items = [];
          activeIdx = -1;
          sugEl.innerHTML = '';
          sugEl.classList.remove('open');
          qEl.setAttribute('aria-expanded', 'false');
        }

        function setActive(i) {
          activeIdx = i;
          var rows = sugEl.children;
          for (var r = 0; r < rows.length; r++) {
            rows[r].classList.toggle('active', r === i);
          }
        }

        function renderSuggestions(list) {
          items = list;
          activeIdx = -1;
          sugEl.innerHTML = '';
          if (!list.length) { closeSuggestions(); return; }
          list.forEach(function (s, i) {
            var li = document.createElement('li');
            li.textContent = s;
            li.setAttribute('role', 'option');
            // mousedown (not click) so it fires before the input loses focus.
            li.addEventListener('mousedown', function (e) {
              e.preventDefault();
              go(s);
            });
            li.addEventListener('mouseenter', function () { setActive(i); });
            sugEl.appendChild(li);
          });
          sugEl.classList.add('open');
          qEl.setAttribute('aria-expanded', 'true');
        }

        function requestSuggestions(term) {
          if (!window.electron || typeof window.electron.suggest !== 'function') return;
          var mySeq = ++seq;
          window.electron.suggest(term).then(function (list) {
            if (mySeq !== seq) return;                 // a newer request superseded this
            if (document.activeElement !== qEl) return; // field lost focus meanwhile
            if (qEl.value.trim().length < 2) return;
            renderSuggestions((list || []).slice(0, 10));
          }).catch(function () {});
        }

        qEl.addEventListener('input', function () {
          var term = qEl.value.trim();
          clearTimeout(debounceTimer);
          if (term.length < 2) { closeSuggestions(); return; }
          debounceTimer = setTimeout(function () { requestSuggestions(term); }, 120);
        });

        qEl.addEventListener('keydown', function (e) {
          if (!sugEl.classList.contains('open') || !items.length) return;
          if (e.key === 'ArrowDown') {
            e.preventDefault();
            setActive((activeIdx + 1) % items.length);
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            setActive((activeIdx - 1 + items.length) % items.length);
          } else if (e.key === 'Enter') {
            // With a row highlighted, go to it; otherwise fall through to submit
            // (search the typed text).
            if (activeIdx >= 0) { e.preventDefault(); go(items[activeIdx]); }
          } else if (e.key === 'Escape') {
            closeSuggestions();
          }
        });

        // Dismiss on outside click / blur.
        document.addEventListener('mousedown', function (e) {
          if (e.target !== qEl && !sugEl.contains(e.target)) closeSuggestions();
        });
        qEl.addEventListener('blur', function () {
          // Delay so a suggestion mousedown can complete first.
          setTimeout(closeSuggestions, 120);
        });

        // Focus the field so typing works immediately on a fresh tab.
        window.addEventListener('load', function () {
          qEl.focus();
        });
      })();
    </script>
  </body>
</html>
